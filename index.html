document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

00vh;background:#f3f4f6;font-family:'Helvetica Neue',Arial,sans-serif;color:#1a1d23;padding:32px 24px 64px\">\n  <div style=\"max-width:1180px;margin:0 auto\">\n\n    <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:6px\">\n      <div style=\"width:26px;height:30px;background:#FFC700;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);\"><\u002Fdiv>\n      <h1 style=\"font-family:'Archivo',Arial,sans-serif;font-weight:800;font-size:30px;color:#001427;margin:0;letter-spacing:-0.02em\">Marketing materialen Blinqx<\u002Fh1>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 22px 42px;font-size:15px;color:#5a6270;max-width:660px\">Vul je gegevens één keer in en maak in de huisstijl van Blinqx een e-mailhandtekening voor Outlook, een visitekaartje, een LinkedIn-banner en een Teams-achtergrond.<\u002Fp>\n\n    <div class=\"tabs\" style=\"display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px 42px\">\n      <button sc-camel-on-click=\"{{ setTabH }}\" style=\"{{ tabHStyle }}\">E-mailhandtekening<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ setTabK }}\" style=\"{{ tabKStyle }}\">Visitekaartje<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ setTabB }}\" style=\"{{ tabBStyle }}\">LinkedIn-banner<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ setTabT }}\" style=\"{{ tabTStyle }}\">Teams-achtergrond<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ setTabP }}\" style=\"{{ tabPStyle }}\">LinkedIn-post<\u002Fbutton>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ tabHandtekening }}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"split\" style=\"display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:28px;align-items:start\">\n\n      <!-- FORM -->\n      <div class=\"card-panel\" style=\"background:#fff;border:1px solid #e2e5ea;border-radius:14px;padding:24px 24px 8px;box-shadow:0 1px 3px rgba(0,20,39,0.06)\">\n\n        <div style=\"display:flex;gap:8px;margin-bottom:18px\">\n          <button sc-camel-on-click=\"{{ saveData }}\" style=\"flex:1;padding:10px 12px;background:#001427;color:#fff;font-size:13px;font-weight:600;border:none;border-radius:8px;cursor:pointer\">Gegevens opslaan<\u002Fbutton>\n          <label style=\"flex:1;padding:10px 12px;background:#fff;color:#001427;font-size:13px;font-weight:600;border:1.5px solid #001427;border-radius:8px;cursor:pointer;text-align:center\">Gegevens uploaden\n            <input type=\"file\" accept=\"application/json,.json\" sc-camel-on-change=\"{{ uploadData }}\" style=\"display:none\">\n          <\u002Flabel>\n        <\u002Fdiv>\n\n        <div style=\"font-family:'Archivo',Arial,sans-serif;font-weight:700;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#001427;margin-bottom:14px\">Persoonlijke gegevens<\u002Fdiv>\n\n        <label style=\"display:block;font-size:12.5px;font-weight:600;color:#3a4453;margin:0 0 5px\">Naam<\u002Flabel>\n        <input type=\"text\" value=\"{{ naam }}\" sc-camel-on-change=\"{{ upNaam }}\" placeholder=\"Jeroen Oversteegen\" style=\"width:100%;padding:10px 12px;font-size:14px;border:1px solid #ccd3df;border-radius:8px;margin-bottom:14px;color:#1a1d23\">\n\n        <label style=\"display:block;font-size:12.5px;font-weight:600;color:#3a4453;margin:0 0 5px\">Functietitel<\u002Flabel>\n        <input type=\"text\" value=\"{{ functie }}\" sc-camel-on-change=\"{{ upFunctie }}\" placeholder=\"Non Executive Director Business Partners\" style=\"width:100%;padding:10px 12px;font-size:14px;border:1px solid #ccd3df;border-radius:8px;margin-bottom:14px;color:#1a1d23\">\n\n        <label style=\"display:block;font-size:12.5px;font-weight:600;color:#3a4453;margin:0 0 5px\">Aanhef<\u002Flabel>\n        <input type=\"text\" value=\"{{ groet }}\" sc-camel-on-change=\"{{ upGroet }}\" placeholder=\"Met vriendelijke groet,\" style=\"width:100%;padding:10px 12px;font-size:14px;border:1px solid #ccd3df;border-radius:8px;margin-bottom:20px;color:#1a1d23\">\n\n        <div style=\"font-family:'Archivo',Arial,sans-serif;font-weight:700;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#001427;margin-bottom:14px\">Contactgegevens<\u002Fdiv>\n\n        <div class=\"twocol\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n          <div>\n            <div style=\"display:flex;justify-content:space-between;align-items:center;margin:0 0 5px\"><span style=\"font-size:12.5px;font-weight:600;color:#3a4453\">Mobiel<\u002Fspan><label style=\"font-weight:400;font-size:11.5px;color:#7a8494;display:flex;align-items:center;gap:5px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ showMobiel }}\" sc-camel-on-change=\"{{ toggleMobiel }}\" style=\"width:14px;height:14px;accent-color:#001427;cursor:pointer\">tonen<\u002Flabel><\u002Fdiv>\n            <input type=\"text\" value=\"{{ mobiel }}\" sc-camel-on-change=\"{{ upMobiel }}\" placeholder=\"+31 6 21 247 257\" style=\"width:100%;padding:10px 12px;font-size:14px;border:1px solid #ccd3df;border-radius:8px;margin-bottom:14px;color:#1a1d23\">\n          <\u002Fdiv>\n          <div>\n            <div style=\"display:flex;justify-content:space-between;align-items:center;margin:0 0 5px\"><span style=\"font-size:12.5px;font-weight:600;color:#3a4453\">Telefoon<\u002Fspan><label style=\"font-weight:400;font-size:11.5px;color:#7a8494;display:flex;align-items:center;gap:5px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ showTelefoon }}\" sc-camel-on-change=\"{{ toggleTelefoon }}\" style=\"width:14px;height:14px;accent-color:#001427;cursor:pointer\">tonen<\u002Flabel><\u002Fdiv>\n            <input type=\"text\" value=\"{{ telefoon }}\" sc-camel-on-change=\"{{ upTelefoon }}\" placeholder=\"020 - 123 45 67\" style=\"width:100%;padding:10px 12px;font-size:14px;border:1px solid #ccd3df;border-radius:8px;margin-bottom:14px;color:#1a1d23\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;justify-content:space-between;align-items:center;margin:0 0 5px\"><span style=\"font-size:12.5px;font- #3a4453;margin:0 0 5px\">Subtekst (optioneel)<\u002Flabel>\n        <textarea value=\"{{ postSub }}\" sc-camel-on-change=\"{{ upPostSub }}\" rows=\"2\" style=\"width:100%;padding:10px 12px;font-size:14px;line-height:1.5;border:1px solid #ccd3df;border-radius:8px;margin-bottom:20px;color:#1a1d23;resize:vertical\"><\u002Ftextarea>\n\n        <div style=\"font-family:'Archivo',Arial,sans-serif;font-weight:700;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#001427;margin-bottom:10px\">Achtergrond<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-bottom:12px\">\n          <button sc-camel-on-click=\"{{ setPostNavy }}\" style=\"{{ postNavyStyle }}\">Navy<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ setPostGeel }}\" style=\"{{ postGeelStyle }}\">Geel<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ setPostFoto }}\" style=\"{{ postFotoStyle }}\">Eigen foto<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ postIsFoto }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px\">\n          <label style=\"display:inline-block;padding:9px 14px;background:#001427;color:#fff;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer\">Kies afbeelding\n            <input type=\"file\" accept=\"image/jpeg,image/png,image/webp\" sc-camel-on-change=\"{{ upPostFoto }}\" style=\"display:none\">\n          <\u002Flabel>\n          <span style=\"font-size:12.5px;color:#7a8494\">{{ postFotoLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <label style=\"display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13.5px;color:#3a4453;margin-bottom:8px\"><input type=\"checkbox\" checked=\"{{ postLogoOn }}\" sc-camel-on-change=\"{{ togglePostLogo }}\" style=\"width:16px;height:16px;accent-color:#001427;cursor:pointer\">Blinqx-logo tonen<\u002Flabel>\n        <label style=\"display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13.5px;color:#3a4453;margin-bottom:20px\"><input type=\"checkbox\" checked=\"{{ postNaamOn }}\" sc-camel-on-change=\"{{ togglePostNaam }}\" style=\"width:16px;height:16px;accent-color:#001427;cursor:pointer\">Naam en functie tonen<\u002Flabel>\n\n        <button sc-camel-on-click=\"{{ dlPost }}\" style=\"width:100%;padding:13px 16px;background:#FFC700;color:#001427;font-family:'Archivo',Arial,sans-serif;font-weight:700;font-size:15px;border:none;border-radius:9px;cursor:pointer;box-shadow:0 2px 6px rgba(0,20,39,0.12);margin-bottom:24px\">Download afbeelding (PNG)<\u002Fbutton>\n\n        <div style=\"font-family:'Archivo',Arial,sans-serif;font-weight:700;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#001427;margin-bottom:10px\">Posttekst<\u002Fdiv>\n        <div style=\"display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ fmtBold }}\" title=\"Zet selectie om naar vet\" style=\"padding:7px 13px;font-size:13px;font-weight:bold;border:1.5px solid #ccd3df;background:#fff;color:#001427;border-radius:7px;cursor:pointer\">B<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ fmtItalic }}\" title=\"Zet selectie om naar cursief\" style=\"padding:7px 13px;font-size:13px;font-style:italic;font-family:Georgia,serif;border:1.5px solid #ccd3df;background:#fff;color:#001427;border-radius:7px;cursor:pointer\">I<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ fmtBoldItalic }}\" title=\"Vet + cursief\" style=\"padding:7px 13px;font-size:13px;font-weight:bold;font-style:italic;font-family:Georgia,serif;border:1.5px solid #ccd3df;background:#fff;color:#001427;border-radius:7px;cursor:pointer\">BI<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ fmtBullet }}\" title=\"Opsommingsteken aan begin van regel\" style=\"padding:7px 13px;font-size:13px;white-space:nowrap;border:1.5px solid #ccd3df;background:#fff;color:#001427;border-radius:7px;cursor:pointer\">• Lijst<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ fmtArrow }}\" title=\"Pijl invoegen\" style=\"padding:7px 13px;font-size:13px;border:1.5px solid #ccd3df;background:#fff;color:#001427;border-radius:7px;cursor:pointer\">→<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ fmtNormal }}\" title=\"Selectie terug naar gewone tekst\" style=\"padding:7px 13px;font-size:12.5px;border:1.5px solid #ccd3df;background:#fff;color:#7a8494;border-radius:7px;cursor:pointer\">Normaal<\u002Fbutton>\n        <\u002Fdiv>\n        <textarea ref=\"{{ setPostTa }}\" value=\"{{ postTekst }}\" sc-camel-on-change=\"{{ upPostTekst }}\" rows=\"7\" placeholder=\"Schrijf hier je LinkedIn-post…\" style=\"width:100%;padding:10px 12px;font-size:13.5px;line-height:1.6;border:1px solid #ccd3df;border-radius:8px;margin-bottom:4px;color:#1a1d23;resize:vertical\"><\u002Ftextarea>\n        <p style=\"margin:0 0 10px;font-size:11.5px;line-height:1.5;color:#9aa1ac\">Selecteer tekst en klik B of I — de opmaak blijft staan als je hem in LinkedIn plakt. Let op: schermlezers en de LinkedIn-zoekfunctie kunnen opgemaakte tekst minder goed lezen, gebruik het dus spaarzaam.<\u002Fp>\n        <label style=\"display:block;font-size:12.5px;font-weight:600;color:#3a4453;margin:0 0 5px\">Hashtags<\u002Flabel>\n        <input type=\"text\" value=\"{{ postTags }}\" sc-camel-on-change=\"{{ upPostTags }}\" style=\"width:100%;padding:10px 12px;font-size:13.5px;border:1px solid #ccd3df;border-radius:8px;margin-bottom:12px;color:#1a1d23\">\n        <button sc-camel-on-click=\"{{ copyPost }}\" style=\"width:100%;padding:12px 16px;background:#001427;color:#fff;font-family:'Archivo',Arial,sans-serif;font-weight:700;font-size:14px;border:none;border-radius:9px;cursor:pointer\">{{ copyPostLabel }}<\u002Fbutton>\n        <p style=\"margin:12px 0 0;font-size:11.5px;line-height:1.6;color:#9aa1ac\">Plak de tekst in een nieuwe LinkedIn-post en voeg de gedownloade afbeelding toe.<\u002Fp>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"font-family:'Archivo',Arial,sans-serif;font-weight:700;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#7a8494;margin-bottom:14px\">Voorbeeld<\u002Fdiv>\n        <div style=\"{{ postFrameStyle }}\">\n          <sc-if value=\"{{ postHasFoto }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"{{ postFotoLayer }}\"><\u002Fdiv><\u002Fsc-if>\n          <div style=\"{{ postContentStyle }}\">\n            <sc-if value=\"{{ postKicker }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"{{ postKickerStyle }}\">{{ postKicker }}<\u002Fdiv><\u002Fsc-if>\n            <div style=\"{{ postTitelStyle }}\">{{ postTitel }}<\u002Fdiv>\n            <sc-if value=\"{{ postSub }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"{{ postSubStyle }}\">{{ postSub }}<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-if value=\"{{ postNaamShow }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"{{ postNaamStyle }}\"><div style=\"font-weight:bold\">{{ naam }}<\u002Fdiv><div style=\"opacity:.8;font-weight:400\">{{ functie }}<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ postLogoShow }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ postLogoSrc }}\" style=\"{{ postLogoStyle }}\"><\u002Fsc-if>\n        <\u002Fdiv>\n        <p style=\"margin:12px 0 0;font-size:12px;color:#9aa1ac\">{{ postFormaatLabel }}<\u002Fp>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    naam: \"Jeroen Oversteegen\",\n    functie: \"Non Executive Director Business Partners\",\n    groet: \"Met vriendelijke groet,\",\n    mobiel: \"+31 6 21 247 257\",\n    telefoon: \"\",\n    email: \"jeroen.oversteegen@blinqx.tech\",\n    website: \"verzekeringhypotheek.blinqx.tech\",\n    adres: \"Hullenbergweg 109\\n1101 CL  Amsterdam\",\n    showMobiel: true,\n    showTelefoon: false,\n    showEmail: true,\n    showWebsite: true,\n    btnDemoOn: true,\n    btnContactOn: true,\n    btnVolgOn: true,\n    btnTrainOn: true,\n    urlDemo: \"https://verzekeringhypotheek.blinqx.tech/demo-aanvraag\",\n    urlContact: \"https://verzekeringhypotheek.blinqx.tech/contact\",\n    urlVolg: \"https://www.linkedin.com/showcase/blinqx-verzekering-hypotheek/\",\n    urlTrain: \"https://verzekeringhypotheek.blinqx.tech/academy\",\n    showDisclaimer: true,\n    disclaimerNL: \"Deze e-mail is uitsluitend bestemd voor de geadresseerde(n). Verstrekking aan en gebruik door anderen is niet toegestaan. Blinqx B.V. sluit iedere aansprakelijkheid uit die voortvloeit uit elektronische verzending.\",\n    disclaimerEN: \"This e-mail is intended exclusively for the addressee(s), and may not be passed on to, or made available for use by any person other than the addressee(s). Blinqx B.V. excludes any liability resulting from any electronic transmission.\",\n    blinqxLogo: \"\",\n    blinqxCardLogo: \"\",\n    blinqxLogoWhite: \"\",\n    btnDemo: \"\",\n    btnContact: \"\",\n    btnVolg: \"\",\n    btnTrain: \"\",\n    tab: \"handtekening\",\n    cardFormat: \"standaard\",\n    accent: \"#FFC700\",\n    frontBg: \"#ffffff\",\n    backBg: \"#001427\",\n    backText: \"#ffffff\",\n    bannerBg: window.__resources.bannerBlack,\n    bannerBgName: \"banner-black.jpeg\",\n    showBannerBg: true,\n    bannerChoice: \"black\",\n    bannerSide: \"left\",\n    bannerOverlay: \"#000000\",\n    bannerText: \"#ffffff\",\n    bannerLogo: \"right\",\n    bShowName: true,\n    bEmail: false, bTel: false, bMob: false, bWeb: false,\n    teamsBg: \"\",\n    teamsBgName: \"Geen bestand gekozen\",\n    teamsUseBg: false,\n    teamsBgColor: \"#001427\",\n    teamsText: \"#ffffff\",\n    teamsSide: \"right\",\n    teamsLogo: \"left\",\n    teamsVisual: \"logo\",\n    teamsBar: true,\n    teamsBarColor: \"#FFC700\",\n    teamsBarTextColor: \"#001427\",\n    teamsBarText: \"Growth Builders.\",\n    teamsShowName: true,\n    tEmail: true, tTel: false, tMob: true, tWeb: true,\n    copied: false,\n    postFormat: \"vierkant\",\n    postKicker: \"Nieuws\",\n    postTitel: \"Wij helpen adviseurs vooruit met slimme software\",\n    postSub: \"Ontdek hoe Blinqx Verzekering & Hypotheek jouw advieswerk versnelt.\",\n    postBg: \"navy\",\n    postFoto: \"\",\n    postFotoName: \"Geen bestand gekozen\",\n    postLogoOn: true,\n    postNaamOn: false,\n    postTekst: \"\",\n    postTags: \"#Blinqx #VerzekeringHypotheek #GrowthBuilders\",\n    postCopied: false\n  };\n\n  POSTFMT = { vierkant: { w: 1080, h: 1080, label: \"1080 × 1080 px — vierkant\" }, staand: { w: 1080, h: 1350, label: \"1080 × 1350 px — staand\" }, liggend: { w: 1200, h: 627, label: \"1200 × 627 px — liggend\" } };\n\n  FORMATS = { standaard: { w: 85, h: 55 }, liggend: { w: 170, h: 55 }, staand: { w: 110, h: 85 } };\n  DARK = \"#001427\";\n  YEL = \"#FFC700\";\n\n  componentDidMount() {\n    this._onResize = () => this.setState({ vw: window.innerWidth });\n    window.addEventListener(\"resize\", this._onResize);\n    this.setState({ vw: window.innerWidth });\n    this.loadAsset(window.__resources.logoBlack, \"blinqxLogo\");\n    this.loadAsset(window.__resources.logoBlack, \"blinqxCardLogo\");\n    this.loadAsset(window.__resources.logoWhite, \"blinqxLogoWhite\");\n    this.loadAsset(window.__resources.btnDemo, \"btnDemo\");\n    this.loadAsset(window.__resources.btnContact, \"btnContact\");\n    this.loadAsset(window.__resources.btnVolgons, \"btnVolg\");\n    this.loadAsset(window.__resources.btnTrainingen, \"btnTrain\");\n    this.loadImg(window.__resources.bannerBlack).then((img) => {\n      if (!img) return;\n      try {\n        const c = document.createElement(\"canvas\");\n        c.width = 1584; c.height = 396;\n        const ctx = c.getContext(\"2d\");\n        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = \"high\";\n        const r = Math.max(1584 / img.width, 396 / img.height);\n        ctx.drawImage(img, (1584 - img.width * r) / 2, (396 - img.height * r) / 2, img.width * r, img.height * r);\n        ctx.fillStyle = \"#000000\";\n        ctx.fillRect(Math.round(1584 * 0.56), Math.round(396 * 0.18), Math.round(1584 * 0.32), Math.round(396 * 0.6));\n        c.toBlob((blob) => {\n          const uri = URL.createObjectURL(blob);\n          this.setState({ bannerBlackClean: uri, bannerBg: this.state.bannerChoice === \"black\" ? uri : this.state.bannerBg });\n        }, \"image/png\");\n      } catch (e) {}\n    });\n    this.loadImg(window.__resources.bannerYellow).then((img) => {\n      if (!img) return;\n      try {\n        const sc = document.createElement(\"canvas\");\n        sc.width = 4; sc.height = 4;\n        sc.getContext(\"2d\").drawImage(img, 10, 80, 8, 8, 0, 0, 4, 4);\n        const d = sc.getContext(\"2d\").getImageData(1, 1, 1, 1).data;\n        const h2 = (x) => x.toString(16).padStart(2, \"0\");\n        const col = \"#\" + h2(d[0]) + h2(d[1]) + h2(d[2]);\n        const c = document.createElement(\"canvas\");\n        c.width = 1584; c.height = 396;\n        const ctx = c.getContext(\"2d\");\n        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = \"high\";\n        ctx.fillStyle = col; ctx.fillRect(0, 0, 1584, 396);\n        const r = Math.min(1584 / img.width, 396 / img.height);\n        const w = img.width * r, h = img.height * r;\n        ctx.drawImage(img, (1584 - w) / 2 + 57 + 30, 8, w, h);\n        c.toBlob((blob) => {\n          const uri = URL.createObjectURL(blob);\n          this.setState({ bannerYellowColor: col, bannerYellowClean: uri, bannerBg: this.state.bannerChoice === \"yellow\" ? uri : this.state.bannerBg });\n        }, \"image/png\");\n      } catch (e) {}\n    });\n  }\n\n  componentDidUpdate() { this.paint(); }\n\n  toDataUri(src) {\n    return new Promise((resolve) => {\n      const img = new Image();\n      img.crossOrigin = \"anonymous\";\n      img.onload = () => {\n        try {\n          const sc = src.endsWith(\".svg\") ? 4 : 1;\n          const c = document.createElement(\"canvas\");\n          c.width = img.naturalWidth * sc; c.height = img.naturalHeight * sc;\n          c.getContext(\"2d\").drawImage(img, 0, 0, c.width, c.height);\n          resolve(c.toDataURL(\"image/png\"));\n        } catch (e) { resolve(src); }\n      };\n      img.onerror = () => resolve(src);\n      img.src = src;\n    });\n  }\n\n  async loadAsset(src, key) { this.setState({ [key]: await this.toDataUri(src) }); }\n\n  up(field) { return (e) => this.setState({ [field]: e.target.value }); }\n\n  esc(s) {\n    return String(s == null ? \"\" : s).replace(/&/g, \"&amp;\").replace(/<\u002Fg, \"&lt;\").replace(/>/g, \"&gt;\");\n  }\n\n  normUrl(u) {\n    u = String(u || \"\").trim();\n    if (!u) return \"\";\n    if (/^(https?:|mailto:|tel:)/i.test(u)) return u;\n    if (/^[^\\s@\\/]+@[^\\s@\\/]+\\.[^\\s@\\/]+$/.test(u)) return \"mailto:\" + u;\n    return \"https://\" + u;\n  }\n\n  cleanTel(t) { return String(t || \"\").replace(/[^0-9+]/g, \"\"); }\n\n  buildSignature() {\n    const s = this.state;\n    const D = this.DARK;\n    const FA = \"font-family:Arial,Helvetica,sans-serif;\";\n    const gap = (h) => `<tr><td style=\"font-size:0;line-height:0;height:${h}px;\">&nbsp;<\u002Ftd><\u002Ftr>`;\n    let rows = \"\";\n\n    if (s.groet) rows += `<tr><td style=\"${FA}font-size:13px;line-height:19px;color:${D};\">${this.esc(s.groet)}<\u002Ftd><\u002Ftr>` + gap(14);\n\n    rows += `<tr><td style=\"${FA}font-size:14px;line-height:20px;font-weight:bold;color:${D};\">${this.esc(s.naam)}<\u002Ftd><\u002Ftr>`;\n    if (s.functie) rows += `<tr><td style=\"${FA}font-size:13px;line-height:19px;color:${D};\">${this.esc(s.functie)}<\u002Ftd><\u002Ftr>`;\n\n    const cl = (lab, val, href) => `<div style=\"${FA}font-size:13px;line-height:20px;color:${D};\">${lab} <a href=\"${href}\" style=\"color:${D};text-decoration:none;\">${this.esc(val)}<\u002Fa><\u002Fdiv>`;\n    let c = \"\";\n    if (s.showMobiel && s.mobiel) c += cl(\"M:\", s.mobiel, \"tel:\" + this.cleanTel(s.mobiel));\n    if (s.showTelefoon && s.telefoon) c += cl(\"T:\", s.telefoon, \"tel:\" + this.cleanTel(s.telefoon));\n    if (s.showEmail && s.email) c += cl(\"E:\", s.email, \"mailto:\" + s.email);\n    if (c) rows += gap(14) + `<tr><td>${c}<\u002Ftd><\u002Ftr>`;\n\n    const addr = String(s.adres || \"\").split(/\\n/).map((l) => l.trim()).filter(Boolean);\n    let a = \"\";\n    for (const ln of addr) a += `<div style=\"${FA}font-size:13px;line-height:20px;color:${D};\">${this.esc(ln)}<\u002Fdiv>`;\n    if (s.showWebsite && s.website) a += `<div style=\"${FA}font-size:13px;line-height:20px;\"><a href=\"${this.normUrl(s.website)}\" style=\"color:${D};font-weight:bold;text-decoration:underline;\">${this.esc(s.website)}<\u002Fa><\u002Fdiv>`;\n    if (a) rows += gap(14) + `<tr><td>${a}<\u002Ftd><\u002Ftr>`;\n\n    if (s.blinqxLogo) rows += gap(18) + `<tr><td><img src=\"${s.blinqxLogo}\" height=\"40\" style=\"display:block;height:40px;width:auto;border:0;\" alt=\"Blinqx\"><\u002Ftd><\u002Ftr>`;\n\n    const btnImg = (src, href, h) => `<a href=\"${href}\" style=\"text-decoration:none;display:inline-block;margin:0 6px 0 0;\"><img src=\"${src}\" height=\"${h}\" style=\"display:inline-block;height:${h}px;width:auto;border:0;vertical-align:middle;\" border=\"0\"><\u002Fa>`;\n    let bs = \"\";\n    if (s.btnDemoOn && s.btnDemo) bs += btnImg(s.btnDemo, this.normUrl(s.urlDemo), 34);\n    if (s.btnContactOn && s.btnContact) bs += btnImg(s.btnContact, this.normUrl(s.urlContact), 34);\n    if (s.btnVolgOn && s.btnVolg) bs += btnImg(s.btnVolg, this.normUrl(s.urlVolg), 34);\n    if (bs) rows += gap(18) + `<tr><td style=\"white-space:nowrap;\">${bs}<\u002Ftd><\u002Ftr>`;\n\n    if (s.btnTrainOn && s.btnTrain) rows += gap(12) + `<tr><td><a href=\"${this.normUrl(s.urlTrain)}\" style=\"text-decoration:none;display:inline-block;\"><img src=\"${s.btnTrain}\" width=\"466\" style=\"display:block;width:466px;max-width:100%;height:auto;border:0;\" border=\"0\
